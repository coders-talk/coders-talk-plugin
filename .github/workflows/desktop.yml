name: Desktop app

# The Coders Talk app for macOS and Windows (desktop/): a tag desktop--vX.Y.Z builds it on each platform with the
# coders-talk file of the same commit inside, and publishes the installers as a GitHub release. A run by hand
# (workflow_dispatch) builds them as artifacts only.
#
# Signing: without the secrets the macOS app is signed ad hoc (Gatekeeper asks the person to allow it in System Settings →
# Privacy & Security) and the Windows installer is unsigned (SmartScreen warns). With them, electron-builder signs and
# notarizes: CSC_LINK + CSC_KEY_PASSWORD (a Developer ID Application certificate, .p12 in base64) and APPLE_ID +
# APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID for macOS; WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD for Windows.
#
# Microsoft Store: the Windows job also builds an MSIX (.appx) with the package identity in desktop/package.json (build.appx,
# from Partner Center → Product identity). The Store signs it, so it needs no certificate; it is an artifact (store-msix) to
# upload in Partner Center, never part of the GitHub release. The Store copy does not update itself (desktop/src/main/updater.mjs).
on:
  push:
    tags: ['desktop--v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mac updates are not ready: these two jobs each write a latest-mac.yml, and the release keeps one of them. One
          # universal app (or a merged latest-mac.yml) comes with the Mac release.
          - { name: macos-arm64, os: macos-latest, target: darwin-arm64 }
          - { name: macos-x64, os: macos-15-intel, target: darwin-x64 }
          - { name: windows-x64, os: windows-latest, target: windows-x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop--v}"
          version=$(node -p "require('./desktop/package.json').version")
          [ "$version" = "$tag" ] || { echo "desktop/package.json says $version, the tag $tag"; exit 1; }
      - run: node scripts/build.mjs ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: codesign -s - --force dist/coders-talk-*
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Tests
        working-directory: desktop
        run: npm test
      - name: Build the app
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # No certificate: no signing identity is looked for (macOS then signs ad hoc).
          [ -n "$CSC_LINK" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          node scripts/stage-cli.mjs
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # latest.yml / latest-mac.yml and the .blockmap files: what the installed apps update from (desktop/src/main/updates.mjs).
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.blockmap
            desktop/out/latest*.yml
          if-no-files-found: error
      - name: Build the Store package (MSIX)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: |
          publisher=$(node -p "require('./package.json').build.appx.publisher")
          case "$publisher" in *00000000-0000*) echo "desktop/package.json build.appx still has the placeholder identity: copy Name, Publisher and PublisherDisplayName from Partner Center → Product identity."; exit 1 ;; esac
          # electron-builder's own makeappx may not start on a newer Windows: the runner's Windows SDK has one that does.
          kit=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          export ELECTRON_BUILDER_WINDOWS_KITS_PATH="$(cygpath -w "$kit")"
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win appx --publish never
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: desktop/out/*.appx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The installers only: the Store package (store-msix) goes to Partner Center, not here.
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: '*64'
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop--v}"
          # Never the repository's latest release: install.sh, install.ps1 and `coders-talk update` download the CLI from
          # releases/latest and refuse a release that is not a coders-talk--v one (lib/update.mjs).
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --latest=false --title "Coders Talk app $version" \
            --notes "The Coders Talk app for macOS (.dmg, Apple silicon and Intel) and Windows (.exe). It carries the coders-talk CLI and installs it in ~/.coders-talk/bin when it is missing or older."
