name: Release

# A tag keepplain--vX.Y.Z publishes the single keepplain file for each platform (plan, stage 13.1) as a GitHub
# release with SHA256SUMS: what https://keepplain.com/install.sh and install.ps1 download, and `keepplain update` too.
on:
  push:
    tags: ['keepplain--v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: darwin-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: The tag matches both manifests
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#keepplain--v}"
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            version=$(node -p "require('./$manifest').version")
            [ "$version" = "$tag" ] || { echo "$manifest says $version, the tag $tag"; exit 1; }
          done
      - run: node scripts/build.mjs ${{ matrix.target }}
      # Unsigned files do not start on Apple silicon; curl sets no quarantine, so an ad-hoc signature is enough.
      - if: runner.os == 'macOS'
        run: codesign -s - --force dist/keepplain-*
      - run: npm run test:binary
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/keepplain-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For the tag's message: what changed goes in its body, under the "keepplain X.Y.Z" line.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The skill for claude.ai: cloud sessions load it by themselves and send through the connector (scripts/skill.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skill for claude.ai
        run: node scripts/skill.mjs
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum keepplain-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#keepplain--v}"
          # checkout leaves an annotated tag as a plain ref to the commit: fetch the tag itself for its message.
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)'
            echo
            echo '### Install'
            echo
            echo '```'
            echo 'curl -fsSL https://keepplain.com/install.sh | sh     # macOS, Linux'
            echo 'irm https://keepplain.com/install.ps1 | iex          # Windows, in PowerShell'
            echo '```'
            echo
            echo 'Then `keepplain login` and `keepplain enable`. Already installed: `keepplain update`. From inside the agent: https://keepplain.com/plugins#from-the-agent'
          } > notes.md
          cat notes.md
          # A tag moved to a fixed commit finds its release already there: that release gets the new files and notes. A
          # download while they upload fails its SHA256SUMS check and is refused (install.sh, update); the next try gets them.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "keepplain $version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "keepplain $version" --notes-file notes.md
          fi
